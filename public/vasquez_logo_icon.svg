<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" fill="none">
  <defs>
    <!-- Background Shield Gradient -->
    <linearGradient id="shieldBg" x1="0" y1="0" x2="200" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0e2a5c" />
      <stop offset="50%" stop-color="#081738" />
      <stop offset="100%" stop-color="#040a1a" />
    </linearGradient>

    <!-- Metallic Royal Blue Gradient -->
    <linearGradient id="royalBlue" x1="40" y1="30" x2="160" y2="170" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="25%" stop-color="#0284c7" />
      <stop offset="60%" stop-color="#0369a1" />
      <stop offset="100%" stop-color="#0c4a6e" />
    </linearGradient>

    <!-- High-Impact Cyan Glow -->
    <linearGradient id="cyanGlow" x1="0" y1="0" x2="200" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#00f0ff" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <!-- Warm Amber Accent for Chimney/Foundation -->
    <linearGradient id="amberGold" x1="0" y1="0" x2="0" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0284c7" flood-opacity="0.6" />
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00f0ff" flood-opacity="0.4" />
    </filter>
    <filter id="badgeShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#020617" flood-opacity="0.8" />
    </filter>
  </defs>

  <!-- Hexagonal Shield Outer Frame -->
  <path d="M100 12 L178 52 L178 136 L100 188 L22 136 L22 52 Z" 
        fill="url(#shieldBg)" 
        stroke="url(#cyanGlow)" 
        stroke-width="4" 
        stroke-linejoin="round"
        filter="url(#badgeShadow)" />

  <!-- Inner Architectural Accent Line -->
  <path d="M100 24 L166 58 L166 130 L100 174 L34 130 L34 58 Z" 
        stroke="rgba(56, 189, 248, 0.3)" 
        stroke-width="1.5" 
        stroke-dasharray="4 3" />

  <!-- Chimney with Warm Amber Brick Accent -->
  <rect x="116" y="46" width="14" height="32" rx="2" fill="url(#amberGold)" stroke="#b45309" stroke-width="1" />
  <!-- Chimney cap -->
  <rect x="113" y="43" width="20" height="5" rx="1.5" fill="#fef3c7" />

  <!-- Twin Architectural Roof Gables -->
  <!-- Main Left Gable -->
  <path d="M38 106 L82 52 L126 106" 
        stroke="#ffffff" 
        stroke-width="6" 
        stroke-linecap="round" 
        stroke-linejoin="round" 
        filter="url(#glow)" />
  
  <!-- Secondary Right Gable -->
  <path d="M100 82 L132 52 L164 106" 
        stroke="#38bdf8" 
        stroke-width="5" 
        stroke-linecap="round" 
        stroke-linejoin="round" />

  <!-- Master Contractor Hardhat Core Silhouette -->
  <!-- Hardhat Dome -->
  <path d="M66 112 C66 84, 134 84, 134 112 Z" 
        fill="url(#royalBlue)" 
        stroke="#ffffff" 
        stroke-width="2.5" />

  <!-- Hardhat Center Structural Ridge -->
  <path d="M100 86 L100 112" 
        stroke="#ffffff" 
        stroke-width="3" 
        stroke-linecap="round" />
  <path d="M84 94 L84 112" 
        stroke="rgba(255,255,255,0.6)" 
        stroke-width="2" 
        stroke-linecap="round" />
  <path d="M116 94 L116 112" 
        stroke="rgba(255,255,255,0.6)" 
        stroke-width="2" 
        stroke-linecap="round" />

  <!-- Hardhat Brim / Visor -->
  <path d="M56 114 C56 110, 144 110, 144 114 L150 120 C150 123, 50 123, 50 120 Z" 
        fill="#ffffff" 
        stroke="#0284c7" 
        stroke-width="1.5" />

  <!-- Precision Chevron 'V' for VASQUEZ Anchor -->
  <path d="M74 134 L100 162 L126 134" 
        stroke="url(#cyanGlow)" 
        stroke-width="6" 
        stroke-linecap="round" 
        stroke-linejoin="round" 
        filter="url(#glow)" />
  <path d="M84 135 L100 152 L116 135" 
        stroke="#ffffff" 
        stroke-width="2.5" 
        stroke-linecap="round" 
        stroke-linejoin="round" />

  <!-- Star of Excellence at Top Peak -->
  <circle cx="82" cy="52" r="3.5" fill="#ffffff" />
  <circle cx="82" cy="52" r="2" fill="#38bdf8" />
</svg>